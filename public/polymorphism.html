<script>
    class Employee{
        FirstName;
        LastName;
        Designation;
        Print(){
            document.write(`${this.FirstName} ${this.LastName} - ${this.Designation}`);
        }
    }
    class Developer extends Employee{
        FirstName = "Neha";
        LastName = "wankhede";
        Designation = "Developer";
        Role = "Developer Role: Build, Debug, Test, Deploy";
        Print(){
            super.Print();
            document.write(`${this.Role}`);
        }
    }
    class Admin extends Employee{
        FirstName = "gaytri";
        LastName = "bagul";
        Designation = "Admin";
        Role = "Admin Role: Authorizations";
        Print(){
            super.Print();
            document.write(`${this.Role}`);
        }
    }
    class Manager extends Employee{
        FirstName = "Nitish";
        LastName = "Kumar";
        Designation = "Manager";
        Role = "Admin Role: Approvals";
        Print(){
            super.Print();
            document.write(`${this.Role}`);
        }
    }
 
    let employees = new Array(new Developer(), new Admin(), new Manager());
    var designation = prompt("Enter Designation");
    for(var employee of employees){
        if(employee.Designation === designation){
            employee.Print();
        }
    }
</script>
